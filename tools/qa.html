<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>BOTEPCO QA</title>
<style>
  body { margin: 16px; font: 14px/1.4 system-ui, sans-serif; color: #13202f; background: #fff; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { margin: 0 0 12px; }
  .sheet { display: flex; flex-wrap: wrap; gap: 12px; }
  .card { flex: none; }
  .card b { display: block; font-size: 11px; margin-bottom: 2px; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .frame { overflow: hidden; border: 1px solid #b9b2a5; background: #f8f6f1; }
  .frame iframe { border: 0; transform-origin: 0 0; display: block; }
  table { border-collapse: collapse; width: 100%; }
  td, th { border: 1px solid #d9d4ca; padding: 4px 6px; text-align: left; vertical-align: top; font-size: 12px; }
  .ok { color: #276338; } .bad { color: #9a4f12; font-weight: 600; }
</style>
</head>
<body>
<h1>BOTEPCO QA</h1>
<p>
  <a href="?mode=sheet&amp;w=375">Contact sheet 375</a> ·
  <a href="?mode=sheet&amp;w=768">768</a> ·
  <a href="?mode=sheet&amp;w=1440">1440</a> ·
  <a href="?mode=check">Run layout checks</a>.
  Pages come from <code>/sitemap.xml</code> plus /search/ and /404.html. Local only: <code>.htaccess</code> blocks /tools/ in production.
</p>
<div id="out"></div>
<script type="module">
// QA harness for the BOTEPCO static site.
// mode=sheet: every page in scaled iframes at one width (from/n to page through).
// mode=check: loads every page at 375/768/1440 and reports horizontal overflow,
//   images that fail to load, clipped text, small tap targets and JS errors.
const params = new URLSearchParams(location.search);
const out = document.getElementById('out');
const sitemap = await fetch('/sitemap.xml', { cache: 'no-store' }).then((r) => r.text());
const urls = [...sitemap.matchAll(/<loc>https?:\/\/[^/<]+([^<]*)<\/loc>/g)].map((m) => m[1]).concat(['/search/?q=licence', '/404.html']);
const mode = params.get('mode') || 'sheet';

function frameFor(url, width, height) {
  const iframe = document.createElement('iframe');
  iframe.width = width;
  iframe.height = height;
  iframe.src = url;
  iframe.title = `${url} at ${width}px`;
  return iframe;
}

if (mode === 'sheet') {
  const width = Number(params.get('w') || 375);
  const scale = Number(params.get('s') || { 375: 0.42, 768: 0.3, 1440: 0.2 }[width] || 0.3);
  const height = Number(params.get('h') || (width === 375 ? 812 : width === 768 ? 1024 : 900));
  const from = Number(params.get('from') || 0);
  const n = Number(params.get('n') || urls.length);
  const sheet = document.createElement('div');
  sheet.className = 'sheet';
  urls.slice(from, from + n).forEach((url) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.width = `${width * scale}px`;
    const label = document.createElement('b');
    label.textContent = url;
    const box = document.createElement('div');
    box.className = 'frame';
    box.style.width = `${width * scale}px`;
    box.style.height = `${height * scale}px`;
    const iframe = frameFor(url, width, height);
    iframe.style.transform = `scale(${scale})`;
    box.append(iframe);
    card.append(label, box);
    sheet.append(card);
  });
  out.append(sheet);
}

async function checkPage(url, width) {
  const iframe = frameFor(url, width, 900);
  // Kept in the viewport (invisible): browsers throttle off-screen frames, which delays image loading
  iframe.style.cssText = 'position:fixed;left:0;top:0;opacity:0;pointer-events:none;z-index:-1';
  const errors = [];
  document.body.append(iframe);
  // Catch errors as early as possible: hook the window as soon as it exists
  const hook = () => {
    try {
      const w = iframe.contentWindow;
      if (!w || w.__qaHooked) return;
      w.__qaHooked = true;
      w.addEventListener('error', (e) => errors.push(e.message || String(e)));
      w.addEventListener('unhandledrejection', (e) => errors.push(`unhandled: ${e.reason}`));
      const orig = w.console.error.bind(w.console);
      w.console.error = (...a) => { errors.push(a.map(String).join(' ')); orig(...a); };
    } catch { /* not ready */ }
  };
  const poll = setInterval(hook, 5);
  await new Promise((resolve) => { iframe.onload = resolve; setTimeout(resolve, 10000); });
  clearInterval(poll);
  hook();
  const d = iframe.contentDocument;
  d.querySelectorAll('img[loading="lazy"]').forEach((img) => { img.loading = 'eager'; });
  // decode() settles once the chosen srcset candidate is loaded (or rejects if it can't be)
  await Promise.all([...d.images].map((img) => Promise.race([img.decode().catch(() => {}), new Promise((r) => setTimeout(r, 2500))])));
  await new Promise((r) => setTimeout(r, 300));

  const issues = [];
  const docWidth = d.documentElement.scrollWidth;
  if (docWidth > width) {
    const wide = [...d.querySelectorAll('body *')].filter((el) => el.getBoundingClientRect().right > width + 1).slice(0, 3)
      .map((el) => `${el.tagName.toLowerCase()}.${(el.className.baseVal ?? el.className) || ''}`);
    issues.push(`horizontal overflow ${docWidth}px: ${wide.join(', ')}`);
  }
  // Throttled (background/hidden) frames may not pick a srcset candidate in time,
  // so for those, request every candidate file instead of trusting naturalWidth.
  for (const img of d.images) {
    if (img.naturalWidth > 0) continue;
    const candidates = img.srcset ? img.srcset.split(',').map((c) => c.trim().split(' ')[0]) : [img.getAttribute('src')];
    for (const src of candidates) {
      const res = await fetch(src, { method: 'HEAD' }).catch(() => null);
      if (!res || !res.ok) issues.push(`broken image ${src}`);
    }
  }

  // Clipped text: content wider than its box where overflow is hidden (ignores intentional clamps)
  d.querySelectorAll('body *').forEach((el) => {
    if (el.closest('.visually-hidden, [hidden], .news-card__excerpt, .search-panel[hidden]')) return;
    const cs = iframe.contentWindow.getComputedStyle(el);
    if ((cs.overflowX === 'hidden' || cs.overflowX === 'clip') && el.scrollWidth > el.clientWidth + 1 && el.clientWidth > 0 && el.tagName !== 'HTML' && el.tagName !== 'BODY') {
      issues.push(`clipped: ${el.tagName.toLowerCase()}.${el.className}`);
    }
  });

  // Target size (WCAG 2.2 AA 2.5.8: 24px), ignoring links inside running text
  const small = [...d.querySelectorAll('a[href], button, input, select, textarea, summary')].filter((el) => {
    if (el.closest('[hidden], .visually-hidden') || el.offsetParent === null) return false;
    if (el.matches('.skip-link')) return false;
    if (el.tagName === 'A' && el.closest('p, li p, dd, .prose li, .accordion__body li, td, .field__hint, .form-note, .stat__note, .breadcrumb')) return false;
    const r = el.getBoundingClientRect();
    return r.width > 0 && (r.height < 24 || r.width < 24);
  }).map((el) => `${el.tagName.toLowerCase()} "${(el.textContent || el.value || '').trim().slice(0, 24)}"`);
  if (small.length) issues.push(`targets < 24px: ${small.slice(0, 4).join('; ')}${small.length > 4 ? ` (+${small.length - 4})` : ''}`);

  errors.forEach((e) => issues.push(`JS: ${e}`));
  iframe.remove();
  return issues;
}

if (mode === 'check') {
  const widths = (params.get('w') || '375,768,1440').split(',').map(Number);
  const table = document.createElement('table');
  table.innerHTML = `<thead><tr><th>Page</th>${widths.map((w) => `<th>${w}px</th>`).join('')}</tr></thead><tbody></tbody>`;
  out.append(table);
  const results = [];
  for (const url of urls) {
    const row = document.createElement('tr');
    row.innerHTML = `<td>${url}</td>`;
    table.tBodies[0].append(row);
    for (const w of widths) {
      const issues = await checkPage(url, w);
      results.push({ url, width: w, issues });
      const cell = document.createElement('td');
      cell.className = issues.length ? 'bad' : 'ok';
      cell.textContent = issues.length ? issues.join(' | ') : 'OK';
      row.append(cell);
    }
  }
  window.__qaResults = results;
  window.__qaDone = true;
  const p = document.createElement('p');
  const bad = results.filter((r) => r.issues.length).length;
  p.textContent = `Done: ${results.length} page/width combinations, ${bad} with issues.`;
  out.prepend(p);
}
</script>
</body>
</html>
